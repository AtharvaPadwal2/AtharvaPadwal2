<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learning journey: Core Java, full-stack JavaScript, AWS Essentials, SIH top-50, Project Unwind, and what comes next" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1033"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="road" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="790" y2="0">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset="1" stop-color="#EA1A85"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#254AA5"/>
    </linearGradient>
    <linearGradient id="nodePink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4DA6"/>
      <stop offset="1" stop-color="#EA1A85"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8C98C4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="trail" d="M90 380 C160 380 160 200 230 200 S300 380 370 380 S440 200 510 200 S580 380 650 380 S720 200 790 200"/>
    <style>
      text { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
      .head { font-size: 11px; letter-spacing: 4px; fill: #8C98C4; }
      .h1 { font-size: 20px; font-weight: 700; fill: #fff; }
      .t { font-size: 13px; font-weight: 700; fill: #fff; }
      .s { font-size: 10px; fill: #fff; fill-opacity: .7; }
      .n { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .tag { font-size: 9px; letter-spacing: 2px; font-weight: 700; }
      .flow { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round;
              stroke-dasharray: 2 18; stroke-opacity: .85; animation: move 1.8s linear infinite; }
      @keyframes move { to { stroke-dashoffset: -40; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; }
      @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.4); opacity: 0; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      .blink { animation: blink 1.2s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="540" rx="18" fill="url(#bg)"/>
  <rect width="900" height="540" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="538" rx="17" fill="none" stroke="#8C98C4" stroke-opacity=".18"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="60" cy="90" r="1.5"/>
    <circle class="twinkle" cx="180" cy="300" r="1.2" style="animation-delay:.6s"/>
    <circle class="twinkle" cx="330" cy="110" r="1.4" style="animation-delay:1.2s"/>
    <circle class="twinkle" cx="450" cy="290" r="1.2" style="animation-delay:1.8s"/>
    <circle class="twinkle" cx="600" cy="100" r="1.5" style="animation-delay:.3s"/>
    <circle class="twinkle" cx="720" cy="300" r="1.2" style="animation-delay:2.1s"/>
    <circle class="twinkle" cx="850" cy="80" r="1.4" style="animation-delay:1s"/>
    <circle class="twinkle" cx="40" cy="470" r="1.3" style="animation-delay:1.5s"/>
    <circle class="twinkle" cx="870" cy="420" r="1.3" style="animation-delay:.9s"/>
  </g>

  <text x="40" y="40" class="head">THE QUEST LOG</text>
  <text x="40" y="66" class="h1">Learning journey</text>

  <!-- road -->
  <use href="#trail" fill="none" stroke="url(#road)" stroke-width="3" stroke-opacity=".4" stroke-linecap="round"/>
  <use href="#trail" class="flow"/>

  <!-- traveling dot -->
  <g filter="url(#glow)">
    <circle r="7" fill="#fff">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#trail"/>
      </animateMotion>
    </circle>
  </g>

  <!-- stems -->
  <g stroke="#8C98C4" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="90" y1="394" x2="90" y2="418"/>
    <line x1="230" y1="186" x2="230" y2="164"/>
    <line x1="370" y1="394" x2="370" y2="418"/>
    <line x1="510" y1="186" x2="510" y2="164"/>
    <line x1="650" y1="394" x2="650" y2="418"/>
    <line x1="790" y1="186" x2="790" y2="164"/>
  </g>

  <!-- nodes -->
  <g>
    <circle class="ring" cx="90" cy="380" r="14" fill="none" stroke="#5B8CFF" stroke-width="2"/>
    <circle cx="90" cy="380" r="14" fill="url(#nodeBlue)" filter="url(#glow)"/>
    <text x="90" y="384.5" class="n">1</text>

    <circle class="ring" cx="230" cy="200" r="14" fill="none" stroke="#5B8CFF" stroke-width="2" style="animation-delay:.5s"/>
    <circle cx="230" cy="200" r="14" fill="url(#nodeBlue)" filter="url(#glow)"/>
    <text x="230" y="204.5" class="n">2</text>

    <circle class="ring" cx="370" cy="380" r="14" fill="none" stroke="#5B8CFF" stroke-width="2" style="animation-delay:1s"/>
    <circle cx="370" cy="380" r="14" fill="url(#nodeBlue)" filter="url(#glow)"/>
    <text x="370" y="384.5" class="n">3</text>

    <circle class="ring" cx="510" cy="200" r="14" fill="none" stroke="#FF4DA6" stroke-width="2" style="animation-delay:1.5s"/>
    <circle cx="510" cy="200" r="14" fill="url(#nodePink)" filter="url(#glow)"/>
    <text x="510" y="204.5" class="n">4</text>

    <circle class="ring" cx="650" cy="380" r="14" fill="none" stroke="#FF4DA6" stroke-width="2" style="animation-delay:2s"/>
    <circle cx="650" cy="380" r="14" fill="url(#nodePink)" filter="url(#glow)"/>
    <text x="650" y="384.5" class="n">5</text>

    <!-- locked / next -->
    <circle class="ring" cx="790" cy="200" r="14" fill="none" stroke="#FF4DA6" stroke-width="2" stroke-dasharray="3 3" style="animation-delay:2.5s"/>
    <circle cx="790" cy="200" r="14" fill="#0A1033" stroke="#FF4DA6" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="790" y="204.5" class="n" fill="#FF4DA6" style="fill:#FF4DA6">?</text>
  </g>

  <!-- cards (bottom: 1,3,5) -->
  <g class="float">
    <rect x="4" y="418" width="172" height="78" rx="12" fill="#101A4D" stroke="#5B8CFF" stroke-opacity=".6"/>
    <text x="20" y="438" class="tag" fill="#5B8CFF" style="fill:#5B8CFF">LEVEL 01</text>
    <text x="20" y="458" class="t">Core Java</text>
    <text x="20" y="474" class="s">Internshala coursework</text>
    <text x="20" y="487" class="s">DSA practice with Java</text>
  </g>
  <g class="float" style="animation-delay:1s">
    <rect x="284" y="418" width="172" height="78" rx="12" fill="#101A4D" stroke="#5B8CFF" stroke-opacity=".6"/>
    <text x="300" y="438" class="tag" style="fill:#5B8CFF">LEVEL 03</text>
    <text x="300" y="458" class="t">AWS Essentials</text>
    <text x="300" y="474" class="s">Cloud Practitioner course</text>
    <text x="300" y="487" class="s">AWS Training &amp; Cert.</text>
  </g>
  <g class="float" style="animation-delay:2s">
    <rect x="564" y="418" width="172" height="78" rx="12" fill="#101A4D" stroke="#EA1A85" stroke-opacity=".7"/>
    <text x="580" y="438" class="tag" style="fill:#FF4DA6">LEVEL 05</text>
    <text x="580" y="458" class="t">Project Unwind</text>
    <text x="580" y="474" class="s">Built, deployed, tested</text>
    <text x="580" y="487" class="s">with real users</text>
  </g>

  <!-- cards (top: 2,4,6) -->
  <g class="float" style="animation-delay:.5s">
    <rect x="144" y="86" width="172" height="78" rx="12" fill="#101A4D" stroke="#5B8CFF" stroke-opacity=".6"/>
    <text x="160" y="106" class="tag" style="fill:#5B8CFF">LEVEL 02</text>
    <text x="160" y="126" class="t">Full-stack JS</text>
    <text x="160" y="142" class="s">React · Redux · Next.js</text>
    <text x="160" y="155" class="s">Node.js · Udemy</text>
  </g>
  <g class="float" style="animation-delay:1.5s">
    <rect x="424" y="86" width="172" height="78" rx="12" fill="#101A4D" stroke="#EA1A85" stroke-opacity=".7"/>
    <text x="440" y="106" class="tag" style="fill:#FF4DA6">LEVEL 04</text>
    <text x="440" y="126" class="t">SIH Top-50</text>
    <text x="440" y="142" class="s">Internal round · team</text>
    <text x="440" y="155" class="s">M.O.L.E. Rover</text>
  </g>
  <g class="float" style="animation-delay:2.5s">
    <rect x="704" y="86" width="172" height="78" rx="12" fill="#101A4D" stroke="#EA1A85" stroke-opacity=".8" stroke-dasharray="5 4"/>
    <text x="720" y="106" class="tag" style="fill:#FF4DA6">UP NEXT</text>
    <text x="720" y="126" class="t">Level 06 loading</text>
    <text x="720" y="142" class="s">Security · Cloud · AI</text>
    <text x="720" y="155" class="s">DevOps · RAG · Systems</text>
  </g>

  <!-- progress bar -->
  <text x="40" y="522" class="s" style="fill:#8C98C4;fill-opacity:1">QUEST PROGRESS</text>
  <rect x="160" y="513" width="300" height="8" rx="4" fill="#161b22"/>
  <rect x="160" y="513" width="250" height="8" rx="4" fill="url(#road)">
    <animate attributeName="width" values="0;250" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="474" y="521" class="s" style="fill:#fff;fill-opacity:.8">5 / 6 unlocked<tspan class="blink"> _</tspan></text>
</svg>

<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build map: frontend, backend, cloud and AI skills feeding into useful products, reliable systems and real-world learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1033"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset="1" stop-color="#254AA5"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4DA6"/>
      <stop offset="1" stop-color="#EA1A85"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#254AA5"/>
      <stop offset="1" stop-color="#EA1A85"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8C98C4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
      .title { font-size: 17px; font-weight: 700; fill: #fff; }
      .sub { font-size: 11px; fill: #fff; fill-opacity: .72; }
      .head { font-size: 11px; letter-spacing: 3px; fill: #8C98C4; }
      .line { fill: none; stroke: url(#flow); stroke-width: 2; stroke-opacity: .35; }
      .dash { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round;
              stroke-dasharray: 2 16; stroke-opacity: .9; animation: move 1.6s linear infinite; }
      @keyframes move { to { stroke-dashoffset: -36; } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
    </style>
  </defs>

  <rect width="900" height="450" rx="18" fill="url(#bg)"/>
  <rect width="900" height="450" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="448" rx="17" fill="none" stroke="#8C98C4" stroke-opacity=".18"/>

  <text x="60" y="44" class="head">WHAT I LEARN</text>
  <text x="640" y="44" class="head">WHAT IT BECOMES</text>

  <!-- connections: left nodes right edge x=310, right nodes left edge x=600 -->
  <g>
    <path class="line" d="M310 100 C455 100 455 140 600 140"/>
    <path class="line" d="M310 190 C455 190 455 140 600 140"/>
    <path class="line" d="M310 190 C455 190 455 250 600 250"/>
    <path class="line" d="M310 280 C455 280 455 250 600 250"/>
    <path class="line" d="M310 280 C455 280 455 360 600 360"/>
    <path class="line" d="M310 370 C455 370 455 360 600 360"/>

    <path class="dash" d="M310 100 C455 100 455 140 600 140"/>
    <path class="dash" d="M310 190 C455 190 455 140 600 140"/>
    <path class="dash" d="M310 190 C455 190 455 250 600 250"/>
    <path class="dash" d="M310 280 C455 280 455 250 600 250"/>
    <path class="dash" d="M310 280 C455 280 455 360 600 360"/>
    <path class="dash" d="M310 370 C455 370 455 360 600 360"/>
  </g>

  <!-- left nodes -->
  <g>
    <rect x="60" y="72" width="250" height="56" rx="12" fill="url(#blue)"/>
    <text x="82" y="97" class="title">Frontend</text>
    <text x="82" y="115" class="sub">React · Vue · Vite</text>

    <rect x="60" y="162" width="250" height="56" rx="12" fill="url(#blue)"/>
    <text x="82" y="187" class="title">Backend &amp; APIs</text>
    <text x="82" y="205" class="sub">Node · Express · FastAPI</text>

    <rect x="60" y="252" width="250" height="56" rx="12" fill="url(#blue)"/>
    <text x="82" y="277" class="title">Cloud + DevOps</text>
    <text x="82" y="295" class="sub">Docker · CI/CD · Linux</text>

    <rect x="60" y="342" width="250" height="56" rx="12" fill="url(#blue)"/>
    <text x="82" y="367" class="title">AI + interactive 3D</text>
    <text x="82" y="385" class="sub">RAG · scikit-learn · Three.js</text>
  </g>

  <!-- right nodes -->
  <g filter="url(#glow)">
    <rect class="pulse" x="600" y="108" width="240" height="64" rx="32" fill="url(#pink)"/>
    <rect class="pulse" x="600" y="218" width="240" height="64" rx="32" fill="url(#pink)"/>
    <rect class="pulse" x="600" y="328" width="240" height="64" rx="32" fill="url(#pink)"/>
  </g>
  <text x="720" y="146" text-anchor="middle" class="title">Useful products</text>
  <text x="720" y="256" text-anchor="middle" class="title">Reliable systems</text>
  <text x="720" y="366" text-anchor="middle" class="title">Real-world learning</text>

  <text x="450" y="430" text-anchor="middle" class="sub" fill-opacity=".5">dark canvas for focus · royal blue for systems · pink for ideas worth shipping</text>
</svg>

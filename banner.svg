<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Atharva Padwal — Full-stack, Security, Cloud, Applied AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A22"/><stop offset="1" stop-color="#0C1440"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
<stop offset="0" stop-color="#9DB7FF"/><stop offset=".35" stop-color="#EA1A85"/><stop offset=".7" stop-color="#4C7DFF"/><stop offset="1" stop-color="#9DB7FF"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#254AA5" stroke-opacity=".12"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1200" height="320" fill="url(#fade)"/></mask>
</defs>
<style>
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.sub{animation:in 1.4s .6s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.code{animation:fl 9s ease-in-out infinite}
.code:nth-of-type(even){animation-duration:12s;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px)}}
.bar{transform-origin:left;animation:draw 1.6s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{transform:scaleX(0)}}
.scan{animation:sc 7s linear infinite}
@keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".75">
<circle cx="200" cy="90" r="150" fill="#254AA5"><animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="90;200;90" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="260" r="140" fill="#EA1A85"><animate attributeName="cx" values="640;520;760;640" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="260;120;260" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="1040" cy="80" r="130" fill="#4C7DFF"><animate attributeName="cx" values="1040;880;1040" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="80;220;80" dur="15s" repeatCount="indefinite"/></circle>
</g>
<rect width="1200" height="320" fill="url(#grid)" mask="url(#m)"/>
<rect class="scan" y="0" width="2" height="320" fill="#EA1A85" opacity=".35"/>
<g fill="#fff">
<circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="270" r="1.4"><animate attributeName="opacity" values=".1;1;.1" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="40" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="3.5s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="285" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="960" cy="50" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="3.2s" begin="-1.5s" repeatCount="indefinite"/></circle>
<circle cx="1120" cy="250" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="4.4s" repeatCount="indefinite"/></circle>
<circle cx="1150" cy="120" r="1.2"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="40" cy="200" r="1.3"><animate attributeName="opacity" values=".1;1;.1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>
<g class="mono" font-size="26" fill="#9DB7FF" fill-opacity=".35">
<text class="code" x="70" y="130">&lt;/&gt;</text>
<text class="code" x="1070" y="215">{ }</text>
<text class="code" x="150" y="265">npm run dev</text>
<text class="code" x="930" y="95">SELECT *</text>
<text class="code" x="1010" y="285">=&gt;</text>
</g>
<text class="sans" x="600" y="165" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="6" fill="url(#tg)" filter="url(#glow)">ATHARVA PADWAL</text>
<rect class="bar" x="470" y="190" width="260" height="3" rx="2" fill="url(#tg)"/>
<text class="mono sub" x="600" y="238" text-anchor="middle" font-size="22" fill="#D6E0FF" letter-spacing="2">Full-stack  •  Security  •  Cloud  •  Applied AI</text>
</svg>
